name: Nightly Playwright Automation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Run Revitin Tests & Report
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Deps
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npx playwright test --project=chromium --workers=1
        continue-on-error: true

      - name: Upload Playwright Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Send Email Report to You and Manager
        uses: dawidd6/action-send-mail@v3
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 'Revitin Automation Report - ${{ job.status }} (${{ github.run_id }})'
          to: 'your-email@example.com,manager-email@example.com'
          from: 'Revitin QA Bot <${{ secrets.MAIL_USERNAME }}>'
          body: |
            Hi Team,

            The nightly automated Playwright test run for Revitin has completed.

            Job Status: ${{ job.status }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            
            View detailed test logs and artifacts here:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
